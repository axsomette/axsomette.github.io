<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t"><title id="t">MonBudget — votre argent, visible mois par mois</title><desc>Le logo MonBudget se trace, puis un tableau de bord d'exemple : les mois de l'année, le reste à vivre (1 256,50 €) et une courbe mois par mois.</desc><style>
.d{font-family:Outfit,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.t{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.rise{animation:rise .5s cubic-bezier(.2,0,0,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .7s cubic-bezier(.2,0,0,1) both}
.growy{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s cubic-bezier(.2,0,0,1) both}
.draw{stroke-dasharray:1 2;stroke-dashoffset:0;animation:draw 1s cubic-bezier(.65,0,.35,1) both}
.odo{animation:odo 1.5s cubic-bezier(.2,0,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1.01}}
@keyframes odo{from{transform:translateY(0)}}

.a1,.a2{stroke-dasharray:1 2;stroke-dashoffset:0}
.a1{animation:draw .6s cubic-bezier(.65,0,.35,1) .08s both}
.a2{animation:draw .38s cubic-bezier(.33,0,.2,1) .48s both}
.dot{transform-box:fill-box;transform-origin:50% 100%;animation:drop .52s linear .82s both}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.6s cubic-bezier(.2,0,0,1) 1.3s infinite}
.word{animation:riseW .42s cubic-bezier(.2,0,0,1) 1s both}
.cap{fill:#c7d2fe;font-size:13px}
.mon{font-size:10.5px;fill:#475569;font-weight:500}
@keyframes drop{0%{opacity:0;transform:translateY(-58px) scale(.4);animation-timing-function:cubic-bezier(.55,0,1,.45)}18%{opacity:1}50%{transform:translateY(0) scale(1.18,.82);animation-timing-function:cubic-bezier(.2,0,0,1)}72%{transform:translateY(-9px) scale(.96,1.05);animation-timing-function:cubic-bezier(.55,0,1,.45)}88%{transform:translateY(0) scale(1.04,.96);animation-timing-function:cubic-bezier(.2,0,0,1)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.55;transform:scale(1)}54%{opacity:0;transform:scale(2.3)}100%{opacity:0;transform:scale(2.3)}}
@keyframes riseW{from{opacity:0;transform:translateY(20px)}}
