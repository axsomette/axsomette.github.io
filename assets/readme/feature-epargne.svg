<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Objectifs d'épargne et score de santé</title><desc>Deux objectifs : vacances été 2027 à 49 %, fonds d'urgence à 62 %. Le score de santé repose sur l'épargne, les budgets, les charges fixes et les objectifs.</desc><style>
.d{font-family:Outfit,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.t{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.rise{animation:rise .5s cubic-bezier(.2,0,0,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .7s cubic-bezier(.2,0,0,1) both}
.growy{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s cubic-bezier(.2,0,0,1) both}
.draw{stroke-dasharray:1 2;stroke-dashoffset:0;animation:draw 1s cubic-bezier(.65,0,.35,1) both}
.odo{animation:odo 1.5s cubic-bezier(.2,0,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1.01}}
@keyframes odo{from{transform:translateY(0)}}

.eb{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#4f46e5}
.h{font-family:Outfit,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a;letter-spacing:-.5px}
.p{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:#475569}
.l{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#0f172a;font-weight:600}
.s{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:#5b6578}
.n{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13.5px;fill:#475569;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}</style><rect x=".5" y=".5" width="599" height="339" rx="22" fill="#fff" stroke="#e2e8f0"/><text x="28" y="42" class="eb">ÉPARGNE &amp; SANTÉ</text><text x="28" y="76" class="h">Épargner avec une vraie traçabilité.</text><text x="28" y="102" class="p">Chaque versement devient une ligne de l'historique.</text><g class="rise" style="animation-delay:0.30s"><text x="28" y="146" class="l">Vacances été 2027</text><text x="572" y="146" class="l" text-anchor="end" fill="#4f46e5" style="fill:#4f46e5">49 %</text></g><rect x="28" y="156" width="544" height="10" rx="5" fill="#eef0f6"/><rect class="grow" style="animation-delay:0.40s;animation-duration:1.1s" x="28" y="156" width="266.6" height="10" rx="5" fill="#4f46e5"/><g class="rise" style="animation-delay:0.80s"><text x="28" y="186" class="s">1 240 € sur 2 500 €</text></g><g class="rise" style="animation-delay:0.55s"><text x="28" y="210" class="l">Fonds d'urgence</text><text x="572" y="210" class="l" text-anchor="end" fill="#10b981" style="fill:#10b981">62 %</text></g><rect x="28" y="220" width="544" height="10" rx="5" fill="#eef0f6"/><rect class="grow" style="animation-delay:0.65s;animation-duration:1.1s" x="28" y="220" width="337.3" height="10" rx="5" fill="#10b981"/><g class="rise" style="animation-delay:1.05s"><text x="28" y="250" class="s">3 100 € sur 5 000 €</text></g><text x="28" y="282" class="s">Score de santé, sur quatre critères :</text><g class="rise" style="animation-delay:1.00s"><rect x="28.0" y="294" width="81.8" height="30" rx="15" fill="#eef0ff"/><circle cx="43.0" cy="309" r="4" fill="#10b981"/><text x="53.0" y="314" class="s" style="fill:#4f46e5" font-weight="600">épargne</text></g><g class="rise" style="animation-delay:1.18s"><rect x="117.8" y="294" width="81.8" height="30" rx="15" fill="#eef0ff"/><circle cx="132.8" cy="309" r="4" fill="#10b981"/><text x="142.8" y="314" class="s" style="fill:#4f46e5" font-weight="600">budgets</text></g><g class="rise" style="animation-delay:1.36s"><rect x="207.6" y="294" width="126.2" height="30" rx="15" fill="#eef0ff"/><circle cx="222.6" cy="309" r="4" fill="#10b981"/><text x="232.6" y="314" class="s" style="fill:#4f46e5" font-weight="600">charges fixes</text></g><g class="rise" style="animation-delay:1.54s"><rect x="341.8" y="294" width="96.6" height="30" rx="15" fill="#eef0ff"/><circle cx="356.8" cy="309" r="4" fill="#10b981"/><text x="366.8" y="314" class="s" style="fill:#4f46e5" font-weight="600">objectifs</text></g></svg>