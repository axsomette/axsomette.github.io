<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Comparer deux mois</title><desc>Barres septembre et octobre pour quatre postes ; les loisirs augmentent de 67 %.</desc><style>
.d{font-family:Outfit,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.t{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.rise{animation:rise .5s cubic-bezier(.2,0,0,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .7s cubic-bezier(.2,0,0,1) both}
.growy{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s cubic-bezier(.2,0,0,1) both}
.draw{stroke-dasharray:1 2;stroke-dashoffset:0;animation:draw 1s cubic-bezier(.65,0,.35,1) both}
.odo{animation:odo 1.5s cubic-bezier(.2,0,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1.01}}
@keyframes odo{from{transform:translateY(0)}}

.eb{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#4f46e5}
.h{font-family:Outfit,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a;letter-spacing:-.5px}
.p{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:#475569}
.l{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#0f172a;font-weight:600}
.s{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:#5b6578}
.n{font-family:Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13.5px;fill:#475569;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}</style><rect x=".5" y=".5" width="599" height="339" rx="22" fill="#fff" stroke="#e2e8f0"/><text x="28" y="42" class="eb">COMPARER</text><text x="28" y="76" class="h">Deux mois côte à côte.</text><text x="28" y="102" class="p">Poste par poste, les dérives sautent aux yeux.</text><g class="t" font-size="12.5"><rect x="400" y="31" width="12" height="12" rx="3" fill="#c7d2fe"/><text x="418" y="42" class="s">Septembre</text><rect x="496" y="31" width="12" height="12" rx="3" fill="#4f46e5"/><text x="514" y="42" class="s">Octobre</text></g><line x1="28" x2="572" y1="300" y2="300" stroke="#e2e8f0"/><rect class="growy" style="animation-delay:0.30s" x="66.0" y="162.7" width="26" height="137.3" rx="5" fill="#c7d2fe"/><rect class="growy" style="animation-delay:0.42s" x="100.0" y="159.9" width="26" height="140.1" rx="5" fill="#4f46e5"/><text x="96.0" y="322" class="s" text-anchor="middle">Essentielles</text><rect class="growy" style="animation-delay:0.45s" x="202.0" y="288.9" width="26" height="11.1" rx="5" fill="#c7d2fe"/><rect class="growy" style="animation-delay:0.57s" x="236.0" y="288.9" width="26" height="11.1" rx="5" fill="#4f46e5"/><text x="232.0" y="322" class="s" text-anchor="middle">Abonnements</text><rect class="growy" style="animation-delay:0.60s" x="338.0" y="228.6" width="26" height="71.4" rx="5" fill="#c7d2fe"/><rect class="growy" style="animation-delay:0.72s" x="372.0" y="180.6" width="26" height="119.4" rx="5" fill="#be123c"/><text x="368.0" y="322" class="s" text-anchor="middle">Loisirs</text><g class="rise" style="animation-delay:1.1s"><rect x="334.0" y="140.6" width="68" height="26" rx="13" fill="#fff0f3"/><text x="368.0" y="158.6" class="l" text-anchor="middle" fill="#be123c" style="fill:#be123c">+67 %</text></g><rect class="growy" style="animation-delay:0.75s" x="474.0" y="288.5" width="26" height="11.5" rx="5" fill="#c7d2fe"/><rect class="growy" style="animation-delay:0.87s" x="508.0" y="288.5" width="26" height="11.5" rx="5" fill="#4f46e5"/><text x="504.0" y="322" class="s" text-anchor="middle">Épargne</text><text x="28" y="142" class="s"></text></svg>