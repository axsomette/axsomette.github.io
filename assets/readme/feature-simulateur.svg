lateY(-132.0px);animation-delay:0.46s"><text x="517.8" y="162.0" text-anchor="middle">0</text><text x="517.8" y="188.4" text-anchor="middle">1</text><text x="517.8" y="214.8" text-anchor="middle">2</text><text x="517.8" y="241.2" text-anchor="middle">3</text><text x="517.8" y="267.6" text-anchor="middle">4</text><text x="517.8" y="294.0" text-anchor="middle">5</text><text x="517.8" y="320.4" text-anchor="middle">6</text><text x="517.8" y="346.8" text-anchor="middle">7</text><text x="517.8" y="373.2" text-anchor="middle">8</text><text x="517.8" y="399.6" text-anchor="middle">9</text></g><g class="odo" style="transform:translateY(0.0px);animation-delay:0.54s"><text x="530.8" y="162.0" text-anchor="middle">0</text><text x="530.8" y="188.4" text-anchor="middle">1</text><text x="530.8" y="214.8" text-anchor="middle">2</text><text x="530.8" y="241.2" text-anchor="middle">3</text><text x="530.8" y="267.6" text-anchor="middle">4</text><text x="530.8" y="294.0" text-anchor="middle">5</text><text x="530.8" y="320.4" text-anchor="middle">6</text><text x="530.8" y="346.8" text-anchor="middle">7</text><text x="530.8" y="373.2" text-anchor="middle">8</text><text x="530.8" y="399.6" text-anchor="middle">9</text></g><text x="542.6" y="162">€</text></g><g class="rise" style="animation-delay:0.60s"><text x="28" y="214" class="l">Loisirs / Autre</text></g><g class="rise" style="animation-delay:0.60s"><text x="450" y="214" class="n" text-anchor="end" fill="#5b6578">398 €</text></g><line class="grow" style="animation-delay:1.05s;animation-duration:.4s" x1="415.7" x2="450" y1="209" y2="209" stroke="#5b6578" stroke-width="1.6"/><g class="rise" style="animation-delay:1.35s"><text x="478" y="214" class="n">→</text><text x="572" y="214" class="n" text-anchor="end" fill="#4f46e5" font-weight="700" style="fill:#4f46e5">260 €</text></g><line x1="28" x2="572" y1="227" y2="227" stroke="#e2e8f0"/><g class="rise" style="animation-delay:0.78s"><text x="28" y="248" class="l">Essentielles</text></g><g