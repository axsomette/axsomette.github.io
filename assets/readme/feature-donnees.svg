<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t"><title id="t">Vos données restent sur l'appareil</title><desc>0 € : gratuit. 0 donnée transmise. 100 % stocké chez vous. Sauvegarde et restauration par fichier JSON.</desc><style>
