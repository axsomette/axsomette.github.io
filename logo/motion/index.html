<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonBudget — animation du logo</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
        main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .card { border-radius: 16px; padding: 16px; text-align: center; }
        .light { background: #f8fafc; border: 1px solid #e2e8f0; }
        .dark { background: #0f172a; color: #e2e8f0; }
        .player { width: 220px; height: 220px; margin: 0 auto; }
        button { margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
        code { font-size: 13px; }
    </style>
</head>
<body>
<main>
    <h1>Animation « Deux mois »</h1>
    <p>Fichiers Lottie (60 i/s, 2,5 s) : même chronologie que le loader CSS de <code>app.html</code>.</p>
    <div class="grid">
        <div class="card light"><div class="player" id="light"></div><code>monbudget-loader.json</code></div>
        <div class="card dark"><div class="player" id="dark"></div><code>monbudget-loader-dark.json</code></div>
    </div>
    <button id="replay">Rejouer</button>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
    const players = ['light', 'dark'].map(id => lottie.loadAnimation({
        container: document.getElementById(id),
        renderer: 'svg',
        loop: false,
        autoplay: true,
        path: id === 'light' ? 'monbudget-loader.json' : 'monbudget-loader-dark.json'
    }));
    document.getElementById('replay').addEventListener('click', () => players.forEach(p => p.goToAndPlay(0, true)));
</script>
</body>
</html>
